name: Cloud-Native Build Engine

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILDKIT_IMAGE: moby/buildkit:v0.33.0
  BUILDX_VERSION: v0.37.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      comfyui-commit: ${{ steps.comfyui.outputs.commit }}
    steps:
      - name: Resolve ComfyUI Commit
        id: comfyui
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git ls-remote https://github.com/Comfy-Org/ComfyUI.git refs/heads/master | cut -f1)"
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [runtime, lite, compile, cuda-devel]
    steps:
      - name: Fetch Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate syntax and compose files
        run: |
          set -euo pipefail
          bash -n entrypoint.sh
          docker compose -f docker-compose.yml.example config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Authenticate to GHCR Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
            type=raw,value=${{ matrix.target }}-${{ github.sha }}-${{ needs.resolve.outputs.comfyui-commit }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.comfyui-commit }}
            org.opencontainers.image.vendor=ComfyUI Docker Build

      - name: Build ${{ matrix.target }} Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            COMFYUI_COMMIT=${{ needs.resolve.outputs.comfyui-commit }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.target }}
            type=gha,scope=${{ github.workflow }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.target }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}

  promote:
    if: github.event_name != 'pull_request'
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Authenticate to GHCR Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Complete Image Suite
        shell: bash
        env:
          COMFYUI_COMMIT: ${{ needs.resolve.outputs.comfyui-commit }}
        run: |
          set -euo pipefail
          for target in runtime lite compile cuda-devel; do
            source_ref="${REGISTRY}/${IMAGE_NAME}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${target}"
            docker buildx imagetools create \
              --tag "${REGISTRY}/${IMAGE_NAME}:${target}" \
              --tag "${REGISTRY}/${IMAGE_NAME}:${target}-${GITHUB_SHA}-${COMFYUI_COMMIT}" \
              "$source_ref"
          done
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runtime"
