name: Cloud-Native Build Engine

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILDKIT_IMAGE: moby/buildkit:v0.33.0
  BUILDX_VERSION: v0.37.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, lite, compile, cuda-devel]
    steps:
      - name: Fetch Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve ComfyUI Commit
        id: comfyui
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git ls-remote https://github.com/Comfy-Org/ComfyUI.git refs/heads/master | cut -f1)"
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Show Docker Builder Versions
        run: |
          docker version
          docker buildx version

      - name: Authenticate to GHCR Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.target }}
            type=raw,value=latest,enable=${{ matrix.target == 'runtime' }}
            type=sha,prefix=${{ matrix.target }}-
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.vendor=ComfyUI Docker Build

      - name: Build and Push ${{ matrix.target }} Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            COMFYUI_COMMIT=${{ steps.comfyui.outputs.commit }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.target }}
            type=gha,scope=${{ github.workflow }}-${{ matrix.target }}
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.target }},mode=max,compression=zstd,oci-mediatypes=true
            type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.target }}
          sbom: true
          provenance: mode=max
