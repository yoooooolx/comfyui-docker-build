services:
  comfyui:
    image: comfyui-docker-build:runtime
    build:
      context: .
      target: runtime
    pull_policy: build
    container_name: comfyui_container
    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:8188:8188"

    environment:
      COMFYUI_LISTEN: 0.0.0.0
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - ./data/models:/app/models
      - ./data/custom_nodes:/app/custom_nodes
      - ./data/output:/app/output
      - ./data/input:/app/input
      - ./data/user:/app/user
